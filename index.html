<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Weather Forecast</h1>
        <p>Get real-time weather information for any location</p>
    </div>
    
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Enter city name, state, or village" id="city-input">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        
        <button class="location-btn" id="location-btn">
            <i class="fas fa-location-arrow"></i> Use My Current Location
        </button>
        
        <div class="loading">
            <i class="fas fa-spinner"></i>
        </div>
        
        <div class="weather-info">
            <h1 class="city-name">Search for a location</h1>
            <p class="date">--</p>
            
            <div class="weather-icon">
                <i class="fas fa-cloud-sun"></i>
            </div>
            
            <div class="temperature">--<span>°C</span></div>
            
            <div class="weather-description">--</div>
            
            <div class="details">
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value">-- km/h</div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-tint"></i>
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value">--%</div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-compress-arrows-alt"></i>
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value">-- hPa</div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-eye"></i>
                    <div class="detail-label">Visibility</div>
                    <div class="detail-value">-- km</div>
                </div>
            </div>
        </div>
        
        <div class="forecast">
            <div class="forecast-item">
                <div class="forecast-day">--</div>
                <div class="forecast-icon"><i class="fas fa-question"></i></div>
                <div class="forecast-temp">--°C</div>
            </div>
            <div class="forecast-item">
                <div class="forecast-day">--</div>
                <div class="forecast-icon"><i class="fas fa-question"></i></div>
                <div class="forecast-temp">--°C</div>
            </div>
            <div class="forecast-item">
                <div class="forecast-day">--</div>
                <div class="forecast-icon"><i class="fas fa-question"></i></div>
                <div class="forecast-temp">--°C</div>
            </div>
            <div class="forecast-item">
                <div class="forecast-day">--</div>
                <div class="forecast-icon"><i class="fas fa-question"></i></div>
                <div class="forecast-temp">--°C</div>
            </div>
            <div class="forecast-item">
                <div class="forecast-day">--</div>
                <div class="forecast-icon"><i class="fas fa-question"></i></div>
                <div class="forecast-temp">--°C</div>
            </div>
        </div>
        
        <div class="error-message" id="error-message">
            Location not found. Please try again.
        </div>
    </div>
     <div class="footer">
        <p>Weather data provided by OpenWeatherMap •</p>
    </div>
<script src="script.js"></script>
</body>
</html>
